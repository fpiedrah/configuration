# Desktop screen layout. Activate on the desktop with:
#   ln -sf desktop.conf ~/.config/hypr/hosts/active.conf
monitor = HDMI-A-1, 2560x1440@59.95, 0x0, 1, transform, 1
monitor = DP-2, 2560x1440@59.95, 1440x510, 1

# Pin workspaces to monitors
workspace = 1, monitor:DP-2
workspace = 2, monitor:DP-2
workspace = 3, monitor:DP-2
workspace = 4, monitor:DP-2
workspace = 5, monitor:HDMI-A-1
workspace = 6, monitor:HDMI-A-1
workspace = 7, monitor:HDMI-A-1
workspace = 8, monitor:HDMI-A-1
