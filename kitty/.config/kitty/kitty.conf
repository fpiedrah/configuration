include ./theme.conf

# Font: Nerd Font is required for the powerlevel10k glyphs. Without it kitty falls
# back to Menlo and sources each glyph ad-hoc, which breaks cell widths under tmux.
font_family BlexMono Nerd Font Mono

# Disable close confirmation
confirm_os_window_close 0

# Shell integration
shell zsh
shell_integration no-sudo

# Remote control
allow_remote_control yes

# Force links to open in Brave
open_url_with /usr/bin/open -a "Brave Browser"

# Arrow keys: nothing to translate. These four used to turn ctrl+shift+hjkl into
# arrows for keyboards that have no arrow cluster. The Urchin has real arrows on
# the EDIT layer, one thumb hold away, on four adjacent fingers of one hand — so
# the translation only added a three-key grip over keys that are no longer a
# cluster on the Ztron alphas. Restore these if a keyboard without arrows is in
# use.

# Tab movement
map ctrl+tab next_tab
map ctrl+shift+tab previous_tab
