# Advertise 256 colors inside tmux (default `screen` claims only 8, which makes
# powerlevel10k collapse to its 8-color fallback palette) and pass truecolor through.
set -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ",xterm*:Tc"
set -as terminal-features ",xterm-kitty:RGB"

set -g mouse on

# Use the login shell (zsh) for new panes, run as a login shell so
# .zprofile (brew shellenv, pixi) is sourced the same as outside tmux.
set -g default-shell "/bin/zsh"

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Prefix to Ctrl-Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Pane movement
# Arrows, not hjkl: on the Urchin's Ztron alphas h and k are the same finger and
# j is on the other hand. The EDIT layer puts all four arrows on one hand under
# adjacent fingers, and -r holds the layer open across a run of presses.
bind -r Left  select-pane -L
bind -r Down  select-pane -D
bind -r Up    select-pane -U
bind -r Right select-pane -R

# Pane closing
# Not x: x is a 30 ms two-key combo on this keyboard.
bind k kill-pane

# Pane splitting
bind o split-window -v -c "#{pane_current_path}"
bind e split-window -h -c "#{pane_current_path}"

bind W new-window

# Switch windows
bind M-Left  previous-window
bind M-Right next-window

bind -r S-Left  resize-pane -L 5
bind -r S-Down  resize-pane -D 5
bind -r S-Up    resize-pane -U 5
bind -r S-Right resize-pane -R 5

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'dreamsofcode-io/catppuccin-tmux'
set -g @plugin 'laktak/extrakto'

run '~/.tmux/plugins/tpm/tpm'
