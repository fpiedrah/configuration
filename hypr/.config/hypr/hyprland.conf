# Hyprland config — https://wiki.hyprland.org/

### MONITORS ###
# Generic default so a fresh machine works with no edits.
# Per-host layout (named monitors, workspace pinning) lives in local/*.conf.
monitor = , preferred, auto, 1

### AUTOSTART ###
exec-once = waybar & hyprpaper
exec-once = dunst
exec-once = cliphist store

### ENVIRONMENT ###
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

cursor {
    no_hardware_cursors = true
    enable_hyprcursor = true
}

### LOOK & FEEL ###
general {
    gaps_in = 4
    gaps_out = 20
    border_size = 2
    col.active_border = rgba(FFA07Aee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
}

decoration {
    rounding = 10

    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
    }

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
}

animations {
    enabled = true
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

### INPUT ###
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = false
    }
}

### LAYER RULES ###
layerrule = blur, wofi
layerrule = ignorezero, wofi
layerrule = ignorealpha 0.5, wofi
layerrule = noanim, hyprpicker
layerrule = noanim, selection

### KEYBINDINGS ###
$mod = SUPER

bind = $mod, RETURN, exec, kitty
bind = $mod, SPACE, exec, wofi --show drun
bind = $mod, X, killactive,
bind = $mod, Y, exec, hyprshot --clipboard-only -m region
bind = $mod SHIFT CTRL, L, exec, hyprlock

# Move focus
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r

# Move window
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, J, movewindow, d
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, L, movewindow, r

# Switch workspace
bind = $mod, R, workspace, 1
bind = $mod, A, workspace, 2
bind = $mod, T, workspace, 3
bind = $mod, D, workspace, 4
bind = $mod, O, workspace, 5
bind = $mod, S, workspace, 6
bind = $mod, N, workspace, 7
bind = $mod, P, workspace, 8

# Move window to workspace
bind = $mod SHIFT, R, movetoworkspace, 1
bind = $mod SHIFT, A, movetoworkspace, 2
bind = $mod SHIFT, T, movetoworkspace, 3
bind = $mod SHIFT, D, movetoworkspace, 4
bind = $mod SHIFT, O, movetoworkspace, 5
bind = $mod SHIFT, S, movetoworkspace, 6
bind = $mod SHIFT, N, movetoworkspace, 7
bind = $mod SHIFT, P, movetoworkspace, 8

### WINDOW RULES ###
windowrulev2 = suppressevent maximize, class:.*
windowrulev2 = float, class:^(dunst)$
windowrulev2 = nofocus, class:^$, title:^$, xwayland:1, floating:1, fullscreen:0, pinned:0

# Float common Firefox dialogs
windowrulev2 = float, class:^(firefox)$, title:^(Picture-in-Picture)$
windowrulev2 = float, class:^(firefox)$, title:^(Open File)$
windowrulev2 = float, class:^(firefox)$, title:^(Save As...)$

### HOST OVERRIDES ###
# Per-machine monitors / workspace pinning. Host files live in hosts/ (committed);
# active.conf is a gitignored symlink to this machine's file, e.g.:
#   ln -sf desktop.conf ~/.config/hypr/hosts/active.conf
source = ~/.config/hypr/hosts/active.conf
