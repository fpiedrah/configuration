# Hyprland Config — https://wiki.hyprland.org/

### MONITORS ###
# Generic Default, Per-Host in hosts/
monitor = , preferred, auto, 1

### AUTOSTART ###
exec-once = waybar & hyprpaper
exec-once = dunst
exec-once = wl-paste --watch cliphist store
exec-once = lxpolkit

### ENVIRONMENT ###
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

cursor {
    no_hardware_cursors = true
    enable_hyprcursor = true
}

### LOOK & FEEL ###
general {
    gaps_in = 4
    gaps_out = 20
    border_size = 2
    col.active_border = rgba(FFA07Aee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
}

decoration {
    rounding = 10

    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
    }

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
}

animations {
    enabled = true
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

### INPUT ###
input {
    kb_layout = us
    kb_variant = intl   # Dead ' and ", AltGr for ñ
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = false
    }
}

### LAYER RULES ###
layerrule = blur, wofi
layerrule = ignorezero, wofi
layerrule = ignorealpha 0.5, wofi
layerrule = noanim, hyprpicker
layerrule = noanim, selection

### KEYBINDINGS ###
$mod = SUPER

bind = $mod, RETURN, exec, kitty
bind = $mod, SPACE, exec, wofi --show drun
bind = $mod, Q, killactive,
bind = $mod, F, fullscreen, 1
bind = $mod, Y, exec, hyprshot --clipboard-only -m region
bind = $mod, C, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy
bind = $mod SHIFT CTRL, L, exec, hyprlock

# Move Focus
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r

# Move Window
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, J, movewindow, d
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, L, movewindow, r

# Resize Window
binde = $mod CTRL, H, resizeactive, -40 0
binde = $mod CTRL, J, resizeactive, 0 40
binde = $mod CTRL, K, resizeactive, 0 -40
binde = $mod CTRL, L, resizeactive, 40 0

# Switch Workspace
bind = $mod, D, workspace, 1
bind = $mod, T, workspace, 2
bind = $mod, A, workspace, 3
bind = $mod, R, workspace, 4
bind = $mod, O, workspace, 5
bind = $mod, S, workspace, 6
bind = $mod, N, workspace, 7
bind = $mod, P, workspace, 8

# Move Window to Workspace
bind = $mod SHIFT, D, movetoworkspace, 1
bind = $mod SHIFT, T, movetoworkspace, 2
bind = $mod SHIFT, A, movetoworkspace, 3
bind = $mod SHIFT, R, movetoworkspace, 4
bind = $mod SHIFT, O, movetoworkspace, 5
bind = $mod SHIFT, S, movetoworkspace, 6
bind = $mod SHIFT, N, movetoworkspace, 7
bind = $mod SHIFT, P, movetoworkspace, 8

### WINDOW RULES ###
windowrulev2 = suppressevent maximize, class:.*
windowrulev2 = float, class:^(dunst)$
windowrulev2 = nofocus, class:^$, title:^$, xwayland:1, floating:1, fullscreen:0, pinned:0

# Float Common Firefox Dialogs
windowrulev2 = float, class:^(firefox)$, title:^(Picture-in-Picture)$
windowrulev2 = float, class:^(firefox)$, title:^(Open File)$
windowrulev2 = float, class:^(firefox)$, title:^(Save As...)$

### HOST OVERRIDES ###
# Per-Host Config, active.conf Links to hosts/<host>.conf
source = ~/.config/hypr/hosts/active.conf
