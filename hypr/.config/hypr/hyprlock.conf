# Minimal lock screen — https://wiki.hyprland.org/hypr-ecosystem/hyprlock/

general {
    grace = 1
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 2
    contrast = 0.8916
    brightness = 0.7172
    vibrancy = 0.1696
    vibrancy_darkness = 0
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(255, 255, 255, 1)
    font_size = 120
    font_family = JetBrains Mono Nerd Font Mono ExtraBold
    position = 0, 120
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%A, %d %B')"
    color = rgba(200, 200, 200, 1)
    font_size = 18
    font_family = JetBrains Mono Nerd Font Mono
    position = 0, 20
    halign = center
    valign = center
}

# Password input
input-field {
    monitor =
    size = 280, 55
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.3)
    inner_color = rgba(0, 0, 0, 0.5)
    font_color = rgba(255, 255, 255, 1)
    fade_on_empty = false
    placeholder_text = <span foreground="##cdd6f4"> $USER</span>
    hide_input = false
    rounding = 10
    position = 0, -60
    halign = center
    valign = center
}
